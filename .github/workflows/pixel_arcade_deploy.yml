name: Deploy Pixel Arcade Lab to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Create Firebase config.local.js files
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          for game_dir in games/quizbuzz games/lietome; do
            cat > "$game_dir/config.local.js" << EOF
          const firebaseConfigLocal = {
            apiKey: "${{ env.FIREBASE_API_KEY }}",
            authDomain: "${{ env.FIREBASE_AUTH_DOMAIN }}",
            databaseURL: "${{ env.FIREBASE_DATABASE_URL }}",
            projectId: "${{ env.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ env.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ env.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ env.FIREBASE_APP_ID }}"
          };
          EOF
          done

      - name: Debug show generated config
        run: |
          echo "--- games/quizbuzz contents ---"
          ls -la games/quizbuzz || true
          echo "--- games/lietome contents ---"
          ls -la games/lietome || true
          echo "--- generated config files ---"
          ls -la games/quizbuzz/config.local.js games/lietome/config.local.js || true

      - name: Verify generated config.local.js files
        run: |
          for config_file in games/quizbuzz/config.local.js games/lietome/config.local.js; do
            if [ ! -f "$config_file" ]; then
              echo "ERROR: $config_file was not created" >&2
              exit 1
            fi
            grep -q '^const firebaseConfigLocal' "$config_file"
          done

      - name: Prepare publish directory
        run: |
          rm -rf deploy
          mkdir deploy
          rsync -a --exclude='.git' --exclude='.github' ./ deploy
          # Remove copied .gitignore so generated secret files are not ignored during git add
          rm -f deploy/.gitignore || true
          ls -la deploy/games/quizbuzz | sed -n '1,20p'
          ls -la deploy/games/lietome | sed -n '1,20p'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAGE_DEPLOY_GITHUB_TOKEN }}
          publish_dir: deploy/
