name: Deploy QuizBuzz to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Create config.local.js
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cat > games/quizbuzz/config.local.js << EOF
          const firebaseConfigLocal = {
            apiKey: "${{ env.FIREBASE_API_KEY }}",
            authDomain: "${{ env.FIREBASE_AUTH_DOMAIN }}",
            databaseURL: "${{ env.FIREBASE_DATABASE_URL }}",
            projectId: "${{ env.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ env.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ env.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ env.FIREBASE_APP_ID }}"
          };
          EOF

      - name: Debug show generated config
        run: |
          echo "--- games/quizbuzz contents ---"
          ls -la games/quizbuzz || true
          echo "--- config.local.js content ---"
          sed -n '1,120p' games/quizbuzz/config.local.js || true

      - name: Verify generated config.local.js
        run: |
          if [ ! -f games/quizbuzz/config.local.js ]; then
            echo "ERROR: games/quizbuzz/config.local.js was not created" >&2
            exit 1
          fi
          grep -q '^const firebaseConfigLocal' games/quizbuzz/config.local.js

      - name: Prepare publish directory
        run: |
          rm -rf deploy
          mkdir deploy
          rsync -a --exclude='.git' --exclude='.github' ./ deploy
          ls -la deploy/games/quizbuzz | sed -n '1,20p'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAGE_DEPLOY_GITHUB_TOKEN }}
          publish_dir: deploy/
