<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Buzz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        h1 {
            color: #f5576c;
            font-size: 2rem;
        }
        .back-button {
            background: #f5576c;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .back-button:hover {
            opacity: 0.9;
        }
        .content {
            text-align: center;
            color: #333;
        }
        p {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Quiz Buzz</h1>
            <button class="back-button" onclick="goBack()">← Back</button>
        </div>
        <div class="content">
            <p>Welcome to Quiz Buzz!</p>
            <p>This is where your quiz game will be built.</p>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = '../../index.html';
        }
    </script>
</body>
</html>
