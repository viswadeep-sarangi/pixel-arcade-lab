<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Arcade Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Trebuchet MS", "Arial Rounded MT Bold", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(245, 87, 108, 0.46), transparent 28%),
                radial-gradient(circle at 84% 76%, rgba(40, 167, 69, 0.34), transparent 30%),
                linear-gradient(135deg, #667eea 0%, #764ba2 46%, #f5576c 100%);
            background-size: 170% 170%, 150% 150%, 220% 220%;
            animation: arcadeSweep 18s ease-in-out infinite alternate;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            animation: gridDrift 28s linear infinite;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            width: min(680px, 100%);
        }

        h1 {
            color: white;
            margin-bottom: 2.25rem;
            font-size: clamp(2.2rem, 8vw, 4.2rem);
            letter-spacing: 0;
            font-family: Impact, "Arial Black", "Trebuchet MS", sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.22);
        }

        .games-grid {
            display: grid;
            gap: 1rem;
        }

        button {
            background: white;
            border: 3px solid rgba(32, 34, 53, 0.18);
            padding: 1rem 1.15rem;
            min-height: 86px;
            font-size: 1.18rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
            font-family: "Trebuchet MS", "Arial Rounded MT Bold", "Segoe UI", sans-serif;
            font-weight: 900;
            color: #202235;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            text-align: left;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.24);
            border-color: rgba(102, 126, 234, 0.62);
        }

        button:active {
            transform: translateY(0);
        }

        .game-icon {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            flex: 0 0 auto;
            position: relative;
            border-radius: 8px;
            color: white;
            font-size: 1.8rem;
            font-weight: 900;
            box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.16);
        }

        .quiz-icon {
            background: linear-gradient(135deg, #667eea, #17a2b8);
        }

        .lie-icon {
            background: linear-gradient(135deg, #f5576c, #ffc107);
            color: #202235;
        }

        .game-label {
            display: grid;
            gap: 0.2rem;
            min-width: 0;
        }

        .game-label small {
            color: #62677c;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .play-mark {
            color: #667eea;
            font-size: 1.55rem;
            font-weight: 900;
        }

        @keyframes arcadeSweep {
            0% { background-position: 0% 35%, 100% 65%, 0% 50%; }
            100% { background-position: 80% 20%, 20% 90%, 100% 50%; }
        }

        @keyframes gridDrift {
            from { background-position: 0 0, 0 0; }
            to { background-position: 72px 36px, 72px 36px; }
        }

        @media (prefers-reduced-motion: reduce) {
            body,
            body::before {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pixel Arcade Lab</h1>
        <div class="games-grid">
            <button onclick="openGame('games/quizbuzz/index.html')">
                <span class="game-icon quiz-icon">?</span>
                <span class="game-label">
                    <span>Quiz Buzz</span>
                    <small>Fast quiz rooms</small>
                </span>
                <span class="play-mark">&gt;</span>
            </button>
            <button onclick="openGame('games/lietome/index.html')">
                <span class="game-icon lie-icon">!</span>
                <span class="game-label">
                    <span>Lie To Me</span>
                    <small>Bluff and vote</small>
                </span>
                <span class="play-mark">&gt;</span>
            </button>
        </div>
    </div>

    <script>
        function openGame(path) {
            window.location.href = path;
        }
    </script>
</body>
</html>
