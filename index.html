<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Arcade Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(245, 87, 108, 0.46), transparent 28%),
                radial-gradient(circle at 84% 76%, rgba(40, 167, 69, 0.34), transparent 30%),
                linear-gradient(135deg, #667eea 0%, #764ba2 46%, #f5576c 100%);
            background-size: 170% 170%, 150% 150%, 220% 220%;
            animation: arcadeSweep 18s ease-in-out infinite alternate;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            animation: gridDrift 28s linear infinite;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            width: min(680px, 100%);
        }

        .pixel-bits {
            position: absolute;
            inset: -74px -34px auto;
            height: 150px;
            pointer-events: none;
            z-index: -1;
        }

        .pixel-bit {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(32, 34, 53, 0.28);
            border-radius: 5px;
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12);
            animation: bob 5.5s ease-in-out infinite;
        }

        .bit-one {
            left: 3%;
            top: 36px;
            background: #ffc107;
        }

        .bit-two {
            right: 8%;
            top: 14px;
            width: 30px;
            height: 30px;
            background: #17a2b8;
            animation-delay: -1.7s;
        }

        .bit-three {
            left: 18%;
            top: 0;
            width: 16px;
            height: 16px;
            background: #28a745;
            animation-delay: -3s;
        }

        h1 {
            color: white;
            margin-bottom: 0.65rem;
            font-size: clamp(2.45rem, 9vw, 5.35rem);
            letter-spacing: 0;
            font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
            font-weight: 900;
            line-height: 1;
            text-shadow:
                0 5px 0 rgba(32, 34, 53, 0.3),
                0 12px 24px rgba(32, 34, 53, 0.22);
            animation: titleFloat 7s ease-in-out infinite;
        }

        .title-pop {
            display: inline-block;
            color: #fff7a8;
            transform: translateY(2px) rotate(-3deg);
        }

        .title-tail {
            display: inline-block;
            color: #ffffff;
            transform: translateY(-3px) rotate(2deg);
        }

        .title-lab {
            display: inline-block;
            color: #ffffff;
            transform: translateY(3px) rotate(-1.5deg);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.86);
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 900;
            margin-bottom: 2rem;
            text-shadow: 0 2px 0 rgba(32, 34, 53, 0.22);
        }

        .games-grid {
            display: grid;
            gap: 1rem;
        }

        button {
            background: white;
            border: 3px solid rgba(32, 34, 53, 0.18);
            padding: 1rem 1.15rem;
            min-height: 86px;
            font-size: 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
            font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
            font-weight: 900;
            color: #202235;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            text-align: left;
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.24);
            border-color: rgba(102, 126, 234, 0.62);
        }

        button:active {
            transform: translateY(0);
        }

        .support-button {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff6ec4 0%, #ff9a56 45%, #ffe066 100%);
            color: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 999px;
            padding: 0.95rem 1.2rem;
            font-size: 1rem;
            font-weight: 900;
            text-decoration: none;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.55);
            box-shadow: 0 18px 40px rgba(255, 102, 146, 0.36), 0 0 24px rgba(255, 255, 255, 0.2);
            transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
            animation: coffeeGlow 4s ease-in-out infinite;
        }

        .support-button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 26px 44px rgba(255, 108, 152, 0.46), 0 0 36px rgba(255, 255, 255, 0.28);
            filter: brightness(1.06);
        }

        @keyframes coffeeGlow {
            0%, 100% {
                transform: translateY(0) scale(1);
                filter: brightness(1);
                box-shadow: 0 18px 40px rgba(255, 102, 146, 0.36), 0 0 24px rgba(255, 255, 255, 0.2);
            }
            50% {
                transform: translateY(-3px) scale(1.02);
                filter: brightness(1.08);
                box-shadow: 0 22px 48px rgba(255, 118, 160, 0.5), 0 0 36px rgba(255, 255, 255, 0.28);
            }
        }

        .game-icon {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            flex: 0 0 auto;
            position: relative;
            border-radius: 8px;
            color: white;
            font-size: 1.8rem;
            font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
            font-weight: 900;
            box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.16);
        }

        .quiz-icon {
            background: linear-gradient(135deg, #667eea, #17a2b8);
        }

        .lie-icon {
            background: linear-gradient(135deg, #f5576c, #ffc107);
            color: #202235;
        }

        .game-label {
            display: grid;
            gap: 0.2rem;
            min-width: 0;
        }

        .game-label span {
            line-height: 1.05;
        }

        .game-label small {
            color: #62677c;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .play-mark {
            color: #667eea;
            font-size: 1.55rem;
            font-weight: 900;
        }

        @keyframes arcadeSweep {
            0% { background-position: 0% 35%, 100% 65%, 0% 50%; }
            100% { background-position: 80% 20%, 20% 90%, 100% 50%; }
        }

        @keyframes gridDrift {
            from { background-position: 0 0, 0 0; }
            to { background-position: 72px 36px, 72px 36px; }
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0) rotate(-0.4deg); }
            50% { transform: translateY(-5px) rotate(0.4deg); }
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            body,
            body::before,
            h1,
            .pixel-bit {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pixel-bits" aria-hidden="true">
            <span class="pixel-bit bit-one"></span>
            <span class="pixel-bit bit-two"></span>
            <span class="pixel-bit bit-three"></span>
        </div>
        <h1><span class="title-pop">Pixel</span> <span class="title-tail">Arcade</span> <span class="title-lab">Lab</span></h1>
        <p class="subtitle">Pick a cabinet and jump in</p>
        <div class="games-grid">
            <button onclick="openGame('games/quizbuzz/index.html')">
                <span class="game-icon quiz-icon">?</span>
                <span class="game-label">
                    <span>Quiz Buzz</span>
                    <small>Fast quiz rooms</small>
                </span>
                <span class="play-mark">&gt;</span>
            </button>
            <button onclick="openGame('games/lietome/index.html')">
                <span class="game-icon lie-icon">!</span>
                <span class="game-label">
                    <span>Lie To Me</span>
                    <small>Bluff and vote</small>
                </span>
                <span class="play-mark">&gt;</span>
            </button>
        </div>
        <a class="support-button" href="https://buy.stripe.com/4gMbJ1aIt6RQ7xj2AYc3m00" target="_blank" rel="noopener noreferrer">
            🎮 Help Continue the Chaos
        </a>
    </div>

    <script>
        function openGame(path) {
            window.location.href = path;
        }
    </script>
</body>
</html>
